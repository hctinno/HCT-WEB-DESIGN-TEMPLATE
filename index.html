<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 로고 마크(H). 워드마크는 16px에서 읽히지 않으므로 파비콘은 따로 둡니다. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%232F4A9C%22%2F%3E%3Cpath%20d%3D%22M10%208v16M22%208v16M10%2016h12%22%20stroke%3D%22%23fff%22%20stroke-width%3D%223.4%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22%2F%3E%3C%2Fsvg%3E" />
    <title>HCT 디자인 시스템 미리보기</title>
    <script>
      /* 첫 페인트 전에 테마와 팔레트를 적용해 깜빡임을 막습니다.
         이 스크립트가 없으면 기본 색으로 한 프레임 그려진 뒤 바뀝니다. */
      try {
        var t = localStorage.getItem('hct-theme')
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
      try {
        /* 팔레트 목록 버전이 다르면 예전 선택을 버립니다 — theme.js 와 같은 규칙 */
        var pv = localStorage.getItem('hct-palette-v')
        var p = pv === '4' ? localStorage.getItem('hct-palette') : null
        document.documentElement.setAttribute('data-palette', p || 'hct')
      } catch (e) {
        document.documentElement.setAttribute('data-palette', 'hct')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/preview.jsx"></script>
  </body>
</html>
