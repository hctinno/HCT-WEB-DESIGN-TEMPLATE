# 디자인 규칙과 빌드를 PR마다 검사합니다.
#
# 이 저장소의 목적은 "여러 사람·에이전트가 만든 화면이 하나의 제품처럼 보이게"
# 하는 것입니다. 규칙을 문서로만 두면 지켜지지 않으므로, 머지 전에 기계가
# 확인합니다. lint:design 이 실패하면 머지되지 않습니다.
name: CI

# 커밋 하나에 워크플로가 한 번만 돌게 합니다.
#
# 처음에는 push 를 branches: ['**'] 로 걸어뒀는데, 그러면 같은 커밋이
# 작업 브랜치 푸시 · release/ 브랜치 푸시 · PR 열기로 **세 번** 검사됩니다.
# 실제로 첫 PR 에서 체크런이 9개(3잡 × 3실행) 잡혔습니다.
#
# 검사가 필요한 곳은 두 군데뿐입니다: 머지하기 전(PR)과 머지된 뒤(main).
# release/ 브랜치는 이미 통과한 커밋의 스냅샷이라 다시 볼 이유가 없습니다.
on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 연달아 푸시하면 앞선 실행을 취소합니다. 어차피 최신
# 커밋의 결과만 의미가 있는데, 취소하지 않으면 러너를 물고 앉아 뒤엣것을
# 기다리게 만듭니다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # package-lock.json 을 커밋하면 npm ci 로 바꾸세요 — 더 빠르고 재현됩니다.
      - name: 의존성 설치
        run: npm install --no-audit --no-fund

      # 로직 층은 스키마 하나에서 모든 화면이 파생되는 자리입니다.
      # applyQuery 가 조용히 틀리면 화면이 전부 함께 틀립니다.
      - name: 단위 테스트
        run: npm test

      - name: 디자인 규칙
        run: npm run lint:design

      # 차트의 선·막대는 글자가 아니라 그래픽 객체입니다. build-palettes 는
      # 글자 대비만 보고, axe-core 는 SVG 도형 색을 아예 검사하지 않습니다.
      # 이 검사가 없으면 차트 색은 아무도 재지 않는 상태로 남습니다.
      - name: 차트 색 대비
        run: npm run audit:charts

      # AGENTS.md 는 다른 에이전트의 주 진입점입니다. 거기 적힌 이름이
      # 실제로 없으면 그 문서를 읽는 모두가 같은 자리에서 막힙니다.
      - name: 문서가 가리키는 이름
        run: npm run audit:docs

      # 아무도 안 쓰는 공개 컴포넌트는 다음 에이전트의 선택지만 늘립니다.
      # 화면 원형이 한 번도 안 쓴 것은 "필요 없는데 만든 것" 이거나
      # "쓰라고 만들었는데 아무도 모르는 것" 입니다 — 둘 다 확인이 필요합니다.
      - name: 미사용 공개 컴포넌트
        run: npm run audit:exports

      # 팔레트 CSS 와 v4 테마는 생성물입니다. 원본만 고치고 재생성을 잊으면
      # 화면과 토큰이 어긋나므로, 생성 결과가 커밋된 것과 같은지 확인합니다.
      # v4 테마는 이 저장소의 미리보기가 쓰지 않아(미리보기는 v3), 여기서
      # 확인하지 않으면 갈라진 채로 배포됩니다.
      - name: 생성 파일이 최신인지
        run: |
          npm run tokens:build
          git diff --exit-code -- src/styles/palettes.css src/styles/theme.v4.css \
            || { echo "::error::원본을 고친 뒤 'npm run tokens:build' 를 실행하고 커밋하세요."; exit 1; }

      - name: 라이브러리 빌드
        run: npm run build:lib

      - name: 미리보기 빌드
        run: npm run build

  # 접근성은 "협상 불가" 라고 문서에 적어두었으니 기계가 재야 합니다.
  # 대비 미달·이름 없는 컨트롤·중복 id 는 화면을 봐도 멀쩡해 보입니다.
  # 개발 서버가 아니라 **운영 빌드**를 검사합니다(개발 서버의 오류 오버레이가
  # 제품과 무관한 위반을 수백 건 만들어냅니다).
  a11y:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 전 화면 접근성 검사 (WCAG 2.1 A/AA)
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run audit:a11y

  # 다른 프로젝트에서 설치했을 때 실제로 동작하는지까지 확인합니다.
  # Tailwind v3 와 v4 양쪽으로 진짜 프로젝트를 만들어 설치하고 빌드합니다.
  # 배럴 export 를 빠뜨리거나 files 목록에서 파일이 새면 여기서 걸립니다.
  consume:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 소비 프로젝트에서 설치하고 빌드
        run: |
          npm install --no-audit --no-fund
          npm run verify:consumer
